name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.14.0"

jobs:
  lint-typecheck-unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  rules-tests:
    name: Firestore/Storage rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:rules

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck-unit]
    # This job only compile-checks `next build` — it never talks to a real
    # Firestore/Auth project, so it deliberately uses the same
    # emulator-shaped dummy config as local dev (see .env.local /
    # src/lib/firebase/admin.ts) rather than a real service account. A real
    # FIREBASE_SERVICE_ACCOUNT_BASE64 secret is only needed for Vercel's own
    # build (a genuine deploy that needs genuine Admin SDK access at
    # runtime) — see docs/launch-runbook.md.
    env:
      NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "true"
      NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: rymx-dev.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: rymx-dev
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: rymx-dev.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      CRON_SECRET: ci-build-dummy-secret
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  sast-and-audit:
    name: SAST, secret scan, dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint security rules
        run: pnpm run lint
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep.yml
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: pnpm audit
        run: pnpm run audit

  e2e-and-dast:
    name: E2E + DAST against Vercel preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [lint-typecheck-unit, rules-tests, build]
    steps:
      - uses: actions/checkout@v5
      - name: Wait for Vercel preview deployment
        id: wait-for-preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright e2e against preview
        run: pnpm exec playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.wait-for-preview.outputs.url }}
      - name: Header-assertion security tests against preview
        run: pnpm exec playwright test --config playwright.security.config.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.wait-for-preview.outputs.url }}
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ steps.wait-for-preview.outputs.url }}
          cmd_options: "-a"
      - name: Lighthouse CI budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.wait-for-preview.outputs.url }}
            ${{ steps.wait-for-preview.outputs.url }}/shop
          configPath: ./.lighthouserc.json
