overrides:
  postcss: ">=8.5.23"
  uuid: ">=11.1.1"
  fast-uri: ">=3.1.5"
  nanoid: "^3.3.18"
  sharp: ">=0.35.0"
  # jwks-rsa (via firebase-admin) still does require('jose'); jose@6 is ESM-only
  # and crashes SSR on Vercel with ERR_REQUIRE_ESM. Pin to dual CJS/ESM jose@5.
  "jwks-rsa>jose": "5.10.0"

allowBuilds:
  "@firebase/util": true
  "@parcel/watcher": false
  "@sentry/cli": true
  "@swc/core": false
  esbuild: true
  protobufjs: true
  re2: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - "@firebase/util"
  - protobufjs
  - re2
  - esbuild
  - "@sentry/cli"
